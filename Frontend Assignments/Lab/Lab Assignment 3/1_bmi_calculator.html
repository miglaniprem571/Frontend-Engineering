<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BMI Calculator</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f0f4f8; display: flex; justify-content: center; padding-top: 50px; }
    .box { background: white; padding: 25px; border-radius: 8px; width: 300px; box-shadow: 0 2px 8px #ccc; }
    input, button { width: 100%; padding: 8px; margin-top: 8px; box-sizing: border-box; }
    button { background: #2d6cdf; color: white; border: none; cursor: pointer; }
    #result { margin-top: 15px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="box">
    <h2>BMI Calculator</h2>

    <label>Height (in cm)</label>
    <input type="number" id="height" placeholder="e.g. 170">

    <label>Weight (in kg)</label>
    <input type="number" id="weight" placeholder="e.g. 65">

    <button onclick="calculateBMI()">Calculate BMI</button>

    <p id="result"></p>
  </div>

  <script>
    function calculateBMI() {
      // 1. Get the values typed by the user
      var height = document.getElementById("height").value;
      var weight = document.getElementById("weight").value;
      var result = document.getElementById("result");

      // 2. Check that both values are entered
      if (height === "" || weight === "" || height <= 0 || weight <= 0) {
        result.innerText = "Please enter valid height and weight.";
        return;
      }

      // 3. Convert height from cm to metres
      var heightInMeters = height / 100;

      // 4. BMI formula = weight / (height * height)
      var bmi = weight / (heightInMeters * heightInMeters);

      // 5. Find the category
      var category = "";
      if (bmi < 18.5) {
        category = "Underweight";
      } else if (bmi < 25) {
        category = "Normal";
      } else {
        category = "Overweight";
      }

      // 6. Show the result (toFixed(1) keeps 1 decimal place)
      result.innerText = "Your BMI is " + bmi.toFixed(1) + " (" + category + ")";
    }
  </script>
</body>
</html>
