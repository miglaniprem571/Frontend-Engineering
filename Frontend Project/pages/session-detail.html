<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session Details | Campus Skill Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

    <header class="header">
        <div class="container nav-container">
            <a href="../index.html" class="logo">
                <span class="logo-icon">🎓</span>
                <span class="logo-text">Campus Skill Hub</span>
            </a>

            <button class="menu-toggle" aria-label="Toggle navigation">☰</button>

            <nav class="nav-menu">
                <ul class="nav-list" style="display: flex; gap: 24px;">
                    <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
                    <li><a href="explore.html" class="nav-link">Explore Skills</a></li>
                    <li><a href="requests.html" class="nav-link">My Requests</a></li>
                </ul>
            </nav>

            <div class="nav-actions">
                <!-- Injected via app.js -->
            </div>
        </div>
    </header>

    <main class="section">
        <div class="container" id="sessionDetailContainer">
            <!-- Rendered dynamically via js/requests.js -->
        </div>
    </main>

    <!-- Feedback Modal -->
    <div class="modal-overlay" id="feedbackModal">
        <div class="modal">
            <div class="modal-header">
                <h3>Session Completed! How was it? ⭐</h3>
                <button class="modal-close" onclick="closeFeedbackModal()">×</button>
            </div>
            <p style="color: var(--text-muted); margin-bottom: 20px; font-size: 0.95rem;">
                Rate your peer mentor session and share feedback to build trust in the campus community.
            </p>

            <form id="feedbackForm">
                <input type="hidden" id="feedbackReqId">

                <div class="form-group" style="text-align: center;">
                    <label class="form-label" style="margin-bottom: 12px; display: block;">Select Rating</label>
                    <div class="star-rating" style="font-size: 2rem; display: flex; justify-content: center; gap: 8px;">
                        <button data-star="1" style="background:none; border:none; cursor:pointer; color:#F59E0B;">★</button>
                        <button data-star="2" style="background:none; border:none; cursor:pointer; color:#F59E0B;">★</button>
                        <button data-star="3" style="background:none; border:none; cursor:pointer; color:#F59E0B;">★</button>
                        <button data-star="4" style="background:none; border:none; cursor:pointer; color:#F59E0B;">★</button>
                        <button data-star="5" style="background:none; border:none; cursor:pointer; color:#F59E0B;">★</button>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="reviewComment">Written Review / Comment</label>
                    <textarea id="reviewComment" class="form-textarea" placeholder="Explain what went well or what you learned during this peer session..." required></textarea>
                </div>

                <button type="submit" class="btn btn-primary btn-full">Submit Feedback ✨</button>
            </form>
        </div>
    </div>

    <footer class="footer">
        <div class="container footer-bottom">
            <p>&copy; 2026 Campus Skill Hub. All rights reserved.</p>
        </div>
    </footer>

    <script src="../js/app.js"></script>
    <script src="../js/requests.js"></script>
</body>
</html>
