<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Session | Campus Skill Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

    <header class="header">
        <div class="container nav-container">
            <a href="../index.html" class="logo">
                <span class="logo-icon">🎓</span>
                <span class="logo-text">Campus Skill Hub</span>
            </a>

            <button class="menu-toggle" aria-label="Toggle navigation">☰</button>

            <nav class="nav-menu">
                <ul class="nav-list" style="display: flex; gap: 24px;">
                    <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
                    <li><a href="explore.html" class="nav-link">Explore Skills</a></li>
                    <li><a href="requests.html" class="nav-link">My Requests</a></li>
                </ul>
            </nav>

            <div class="nav-actions">
                <!-- Injected via app.js -->
            </div>
        </div>
    </header>

    <main class="section flex-center">
        <div class="container" style="max-width: 680px;">
            <div class="card" style="padding: 36px;">
                
                <div style="margin-bottom: 24px;">
                    <h1 style="font-size: 1.6rem; margin-bottom: 6px;">Request a Skill Session 🤝</h1>
                    <p style="color: var(--text-muted); font-size: 0.95rem;">Propose a date, time, and learning topic with your chosen campus peer.</p>
                </div>

                <!-- Selected Peer Summary Box -->
                <div class="card" style="background: var(--bg-page); padding: 16px; margin-bottom: 24px; border: 1px dashed var(--border-color);">
                    <div style="display: flex; gap: 16px; align-items: center;">
                        <div class="avatar" id="targetAvatar">AS</div>
                        <div>
                            <h3 id="targetStudentName" style="font-size: 1.1rem;">Arjun Sharma</h3>
                            <p id="targetStudentRole" style="font-size: 0.875rem; color: var(--text-muted);">Frontend Developer • B.Tech CSE</p>
                        </div>
                    </div>
                </div>

                <form id="requestSessionForm">
                    <div class="form-group">
                        <label class="form-label" for="requestSkill">Select Skill to Learn</label>
                        <select id="requestSkill" class="form-select">
                            <!-- Populated via js/skills.js -->
                        </select>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="requestDate">Preferred Date</label>
                            <input type="date" id="requestDate" class="form-input" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="requestTime">Preferred Time</label>
                            <input type="time" id="requestTime" class="form-input" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="requestMode">Learning Mode</label>
                        <select id="requestMode" class="form-select">
                            <option value="Online (Google Meet / Zoom)">Online (Google Meet / Zoom)</option>
                            <option value="Offline (Campus Library)">Offline (Campus Library)</option>
                            <option value="Offline (Student Center)">Offline (Student Center / Cafeteria)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="requestMessage">Message / Topic Details</label>
                        <textarea id="requestMessage" class="form-textarea" placeholder="Hi! I want to learn and practice React state management with you during this session."></textarea>
                    </div>

                    <div class="flex-between" style="margin-top: 24px;">
                        <a href="javascript:history.back()" class="btn btn-outline">Cancel</a>
                        <button type="submit" class="btn btn-primary">Send Request 🚀</button>
                    </div>
                </form>

            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container footer-bottom">
            <p>&copy; 2026 Campus Skill Hub. All rights reserved.</p>
        </div>
    </footer>

    <script src="../js/app.js"></script>
    <script src="../js/skills.js"></script>
    <script>
        // Set default date to tomorrow
        document.addEventListener('DOMContentLoaded', () => {
            const dateInput = document.getElementById('requestDate');
            if (dateInput) {
                const tomorrow = new Date();
                tomorrow.setDate(tomorrow.getDate() + 1);
                dateInput.value = tomorrow.toISOString().split('T')[0];
            }
        });
    </script>
</body>
</html>
