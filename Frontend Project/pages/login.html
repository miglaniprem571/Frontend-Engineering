<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Campus Skill Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

    <header class="header">
        <div class="container nav-container">
            <a href="../index.html" class="logo">
                <span class="logo-icon">🎓</span>
                <span class="logo-text">Campus Skill Hub</span>
            </a>
            <div class="nav-actions">
                <a href="signup.html" class="btn btn-primary btn-sm">Sign Up</a>
            </div>
        </div>
    </header>

    <main class="section flex-center" style="min-height: 80vh;">
        <div class="container" style="max-width: 960px;">
            <div class="grid grid-2" style="align-items: center; gap: 48px;">
                
                <!-- Left: Login Form -->
                <div class="card" style="padding: 40px;">
                    <div style="margin-bottom: 24px;">
                        <h1 style="font-size: 1.75rem; margin-bottom: 8px;">Welcome Back 👋</h1>
                        <p style="color: var(--text-muted); font-size: 0.95rem;">Log in to access your student dashboard & skill requests.</p>
                    </div>

                    <form id="loginForm">
                        <div class="form-group">
                            <label class="form-label" for="email">College Email Address</label>
                            <input type="email" id="email" class="form-input" placeholder="e.g. prem.miglani@college.edu" value="prem.miglani@college.edu" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="password">Password</label>
                            <input type="password" id="password" class="form-input" placeholder="••••••••" value="password123" required>
                        </div>

                        <div class="flex-between" style="margin-bottom: 24px;">
                            <label class="checkbox-group">
                                <input type="checkbox" id="rememberMe" checked>
                                Remember me
                            </label>
                            <a href="#" style="font-size: 0.875rem; color: var(--primary); font-weight: 600;" onclick="alert('Demo reset link sent to your college email!')">Forgot password?</a>
                        </div>

                        <button type="submit" class="btn btn-primary btn-full">Log In to Dashboard 🚀</button>
                    </form>

                    <div style="margin-top: 24px; text-align: center; font-size: 0.9rem; color: var(--text-muted);">
                        Don't have an account? <a href="signup.html" style="color: var(--primary); font-weight: 600;">Sign up</a>
                    </div>
                </div>

                <!-- Right: Visual Promo -->
                <div class="card" style="background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #FFFFFF; padding: 48px; text-align: center;">
                    <span style="font-size: 3rem; display: block; margin-bottom: 16px;">🤝</span>
                    <h2 style="font-size: 2rem; color: #FFFFFF; margin-bottom: 16px;">Connect. Learn. Grow.</h2>
                    <p style="color: #EEF2FF; font-size: 1.05rem; line-height: 1.6;">
                        Join 500+ students on campus who are actively exchanging skills, building portfolios, and growing together every semester.
                    </p>
                </div>

            </div>
        </div>
    </main>

    <script src="../js/app.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
